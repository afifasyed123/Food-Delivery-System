name: Food Delivery CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test, Build & Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Inspect Jira Smart Commits
        run: |
          echo "Commit messages in this push:"
          git log -n 5 --oneline

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: 🧪 Run Backend Tests & Prometheus Metric Validation
        run: |
          cd backend
          npm ci
          npm test

      - name: 📦 Build Frontend Web Application
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 🐳 Validate Docker Compose Config
        run: |
          docker compose config

      - name: 🚀 Test Docker Image Builds
        run: |
          docker compose build
